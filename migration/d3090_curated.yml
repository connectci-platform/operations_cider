# D8-3090 curated node type migrations, keyed by global resource id.
#
# The operations_cider_deploy_d3090_01_node_types deploy hook applies an entry
# only while legacy_hash still matches the resource's legacy queue rows; if
# the rows were edited after the entry was written, the resource is skipped
# and reported. Each entry covers a resource that the automatic merge flags.
#
# Review: drush operations_cider:d3090-summary
# Draft a new entry: drush operations_cider:d3090-draft <global id>
#
# Values were taken from the legacy queue rows and the resource's own jobs
# text. charged_per and access are only set where that text states them;
# blank means unknown.

